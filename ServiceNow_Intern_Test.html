<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServiceNow CSA Readiness Assessment - Vancouver Edition</title>
    <style>
        :root { --sn-dark: #293e40; --sn-green: #81b5a1; --sn-light: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #333; max-width: 950px; margin: 0 auto; padding: 20px; background-color: var(--sn-light); }
        .header { background-color: var(--sn-dark); color: white; padding: 30px; border-radius: 8px; margin-bottom: 30px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .question-card { background: white; padding: 25px; margin-bottom: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-left: 5px solid #ccc; position: relative; }
        .difficulty { font-size: 0.75em; font-weight: bold; text-transform: uppercase; padding: 4px 10px; border-radius: 12px; margin-bottom: 12px; display: inline-block; }
        .low { background-color: #d4edda; color: #155724; }
        .medium { background-color: #fff3cd; color: #856404; }
        .high { background-color: #f8d7da; color: #721c24; }
        .options { list-style: none; padding: 0; margin-top: 15px; }
        .options li { margin: 12px 0; padding: 12px; border: 1px solid #eee; border-radius: 6px; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; }
        .options li:hover { background-color: #f9f9f9; border-color: var(--sn-green); }
        input[type="radio"] { margin-right: 15px; transform: scale(1.2); }
        #resultsArea { display: none; margin-top: 40px; padding: 30px; background: white; border-radius: 8px; border-top: 8px solid var(--sn-dark); }
        .correct { border-left-color: #28a745 !important; background-color: #f8fff9; }
        .incorrect { border-left-color: #dc3545 !important; background-color: #fff8f8; }
        .explanation { font-size: 0.95em; margin-top: 15px; padding: 15px; background: #eef2f3; border-radius: 4px; color: #444; }
        .link { color: #0056b3; text-decoration: underline; cursor: pointer; }
        button { background-color: var(--sn-dark); color: white; border: none; padding: 18px 40px; font-size: 18px; border-radius: 6px; cursor: pointer; display: block; margin: 30px auto; transition: 0.3s; }
        button:hover { background-color: #1a2a2b; transform: translateY(-2px); }
        .score-box { font-size: 24px; font-weight: bold; text-align: center; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="header">
    <h1>ServiceNow CSA Pre-Assessment</h1>
    <p>Vancouver Release Benchmark | 20 Scenario-Based Questions</p>
</div>

<form id="quizForm">
    <div id="questionsContainer"></div>
    <button type="button" onclick="calculateResults()">Submit for Review</button>
</form>

<div id="resultsArea">
    <div class="score-box" id="scoreSummary"></div>
    <div id="reviewDetails"></div>
    <button type="button" onclick="window.scrollTo(0,0)">Back to Top</button>
</div>

<script>
    const questions = [
        {
            id: 1, diff: 'low', text: "In the Vancouver Next Experience, where does a user go to see their recently viewed records and favorites?",
            options: ["A) The History and Favorites tabs in the Unified Navigation header.", "B) The System Log module.", "C) The Gear icon on the form header.", "D) The User Group dashboard."],
            ans: "A",
            exp: "Vancouver uses Unified Navigation. Favorites and History are now menus at the top of the screen."
        },
        {
            id: 2, diff: 'medium', text: "An intern needs to ensure that the 'Assignment Group' is mandatory only when the 'State' is 'In Progress'. Which tool is best for this UI requirement?",
            options: ["A) Data Policy", "B) UI Policy", "C) Client Script", "B) Business Rule"],
            ans: "B",
            exp: "UI Policies are used for client-side form behavior like visibility and mandatory requirements."
        },
        {
            id: 3, diff: 'low', text: "Which ServiceNow table stores all individual user records?",
            options: ["A) sys_user_group", "B) sys_user", "C) user_list", "D) core_company"],
            ans: "B",
            exp: "The sys_user table is the foundation for all identity management in ServiceNow."
        },
        {
            id: 4, diff: 'high', text: "Scenario: You are importing data and want to prevent the creation of duplicate records. If the 'Email' matches an existing record, update it; otherwise, create a new one. What do you set the 'Email' field to in the Transform Map?",
            options: ["A) Mandatory", "B) Indexed", "C) Coalesce", "D) Unique"],
            ans: "C",
            exp: "Coalesce fields act as a unique key to determine if a record should be updated or created during an import."
        },
        {
            id: 5, diff: 'medium', text: "What runs on the server side and can be used to display an error message that stops a user from saving a record?",
            options: ["A) UI Script", "B) UI Action", "C) Business Rule", "D) Client Script"],
            ans: "C",
            exp: "A 'Before' Business Rule can use 'setAbortAction(true)' to prevent database writes."
        },
        {
            id: 6, diff: 'low', text: "Which module is used to change the branding, such as the company logo and color scheme, for the entire instance?",
            options: ["A) Basic Configuration UI16", "B) Guided Setup", "C) Theme Builder", "D) Form Designer"],
            ans: "C",
            exp: "In Vancouver, Theme Builder is the primary tool for branding the Next Experience UI."
        },
        {
            id: 7, diff: 'medium', text: "Which of the following is a collection of permissions used to grant access to applications and modules?",
            options: ["A) Group", "B) Profile", "C) Role", "D) Department"],
            ans: "C",
            exp: "Roles are assigned to users or groups to grant access rights."
        },
        {
            id: 8, diff: 'high', text: "An ACL (Access Control) is failing for a user. The ACL has a Role requirement, a Condition, and a Script. Which must be true for the user to gain access?",
            options: ["A) Only the Role", "B) Any one of the three", "C) The Role and either the Condition or Script", "D) All three (Role, Condition, and Script)"],
            ans: "D",
            exp: "ACL evaluation requires all three components to evaluate to true."
        },
        {
            id: 9, diff: 'low', text: "In the Service Catalog, what creates a single task-based record (like an Incident or Change) from a front-end form?",
            options: ["A) Order Guide", "B) Record Producer", "C) Catalog Item", "D) Content Item"],
            ans: "B",
            exp: "Record Producers allow users to create records on task tables via the Service Portal/Catalog."
        },
        {
            id: 10, diff: 'medium', text: "What is the primary table for the Configuration Management Database (CMDB)?",
            options: ["A) cmdb_ci", "B) cmdb_rel_ci", "C) task_cmdb", "D) asset_list"],
            ans: "A",
            exp: "cmdb_ci is the base table for all Configuration Items."
        },
        {
            id: 11, diff: 'low', text: "A user wants to filter a list of Incidents to show only those with a 'High' priority. Where do they click?",
            options: ["A) The Filter Icon (Funnel)", "B) The Gear Icon", "C) The Hamburger Menu", "D) The Magnifying Glass"],
            ans: "A",
            exp: "The Filter Icon opens the Condition Builder for list filtering."
        },
        {
            id: 12, diff: 'high', text: "You need to move a new Table and five Business Rules from Dev to Production. What tool should you use?",
            options: ["A) Import Sets", "B) Export to CSV", "C) Update Sets", "D) Data Loader"],
            ans: "C",
            exp: "Update Sets capture configuration changes (metadata) to move between instances."
        },
        {
            id: 13, diff: 'medium', text: "Which tool provides a graphical interface for building a process sequence from triggers to actions?",
            options: ["A) Workflow Editor", "B) Flow Designer", "C) Process Engine", "D) Script Include"],
            ans: "B",
            exp: "Flow Designer is the modern, preferred tool for process automation in Vancouver."
        },
        {
            id: 14, diff: 'low', text: "When looking at a form, what do you call the area that shows the history of comments and work notes?",
            options: ["A) Activity Stream", "B) Audit Log", "C) Notes Section", "D) Journal Field"],
            ans: "A",
            exp: "The Activity Stream (or Form formatter) displays the chronological history of interactions."
        },
        {
            id: 15, diff: 'medium', text: "What is the purpose of a 'Knowledge Base'?",
            options: ["A) To store passwords for users", "B) To organize and store 'How-to' articles and troubleshooting guides", "C) To keep a list of all server hardware", "D) To track software licenses"],
            ans: "B",
            exp: "Knowledge Bases store articles that help users and agents resolve issues via self-service."
        },
        {
            id: 16, diff: 'high', text: "Which of the following describes a 'Reference' field?",
            options: ["A) A field that only accepts numbers", "B) A field that stores a link to a record on another table", "C) A field that is read-only for all users", "D) A field that allows multiple choices via a dropdown"],
            ans: "B",
            exp: "Reference fields store the SysID of a record on another table, creating a relationship."
        },
        {
            id: 17, diff: 'low', text: "What is the 'Global Search' used for?",
            options: ["A) Searching only for users", "B) Searching for records across multiple tables from the header", "C) Searching the internet from within ServiceNow", "D) Searching for specific code in the script editor"],
            ans: "B",
            exp: "Global Search allows you to find records (Incidents, Knowledge, etc.) from anywhere in the platform."
        },
        {
            id: 18, diff: 'medium', text: "An administrator wants to limit which countries can see a specific Knowledge Article. What should they use?",
            options: ["A) UI Policies", "B) User Criteria", "C) Client Scripts", "D) Catalog Categories"],
            ans: "B",
            exp: "User Criteria is used to control who can read/contribute to Knowledge Bases or Service Catalog items."
        },
        {
            id: 19, diff: 'high', text: "In a 'One-to-Many' relationship, which field type is typically used on the 'Many' side to point to the 'One'?",
            options: ["A) String field", "B) Choice field", "C) Reference field", "D) Journal field"],
            ans: "C",
            exp: "A Reference field on the child table (many) points to the parent table (one)."
        },
        {
            id: 20, diff: 'medium', text: "Which of these represents the correct order of the 'Load Data' process?",
            options: ["A) Transform Map -> Load Data -> Run Transform", "B) Load Data -> Create Transform Map -> Run Transform", "C) Run Transform -> Load Data -> Map Fields", "D) Import Set -> Target Table -> Load Data"],
            ans: "B",
            exp: "You first load the data into a staging table, then map it, then execute the transformation."
        }
    ];

    function initQuiz() {
        const container = document.getElementById('questionsContainer');
        questions.forEach((q, index) => {
            const card = document.createElement('div');
            card.className = 'question-block';
            card.innerHTML = `
                <div class="question-card" id="card-${q.id}">
                    <span class="difficulty ${q.diff}">Difficulty: ${q.diff}</span>
                    <p><strong>${index + 1}. ${q.text}</strong></p>
                    <ul class="options">
                        ${q.options.map((opt, i) => `
                            <li>
                                <input type="radio" name="q${q.id}" value="${opt[0]}" id="q${q.id}opt${i}">
                                <label for="q${q.id}opt${i}">${opt}</label>
                            </li>
                        `).join('')}
                    </ul>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function calculateResults() {
        let score = 0;
        let reviewHtml = "";

        questions.forEach(q => {
            const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
            const userAns = selected ? selected.value : "Not Answered";
            const isCorrect = userAns === q.ans;
            if (isCorrect) score++;

            const card = document.getElementById(`card-${q.id}`);
            card.className = `question-card ${isCorrect ? 'correct' : 'incorrect'}`;

            reviewHtml += `
                <div class="question-card ${isCorrect ? 'correct' : 'incorrect'}">
                    <p><strong>Question ${q.id}</strong>: ${isCorrect ? '✅ Correct' : '❌ Incorrect'}</p>
                    <p>Your Answer: <b>${userAns}</b> | Correct Answer: <b>${q.ans}</b></p>
                    <div class="explanation">
                        <strong>Why?</strong> ${q.exp} <br><br>
                        <a href="https://docs.servicenow.com/search?q=Vancouver+${encodeURIComponent(q.text.split(' ').slice(0,3).join(' '))}" target="_blank" class="link">View Vancouver Documentation</a>
                    </div>
                </div>
            `;
        });

        document.getElementById('scoreSummary').innerHTML = `Final Score: ${score} / ${questions.length}`;
        document.getElementById('reviewDetails').innerHTML = reviewHtml;
        document.getElementById('resultsArea').style.display = 'block';
        document.getElementById('quizForm').style.display = 'none';
        window.scrollTo(0, 0);
    }

    window.onload = initQuiz;
</script>

</body>
</html>
